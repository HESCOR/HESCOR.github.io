ense like Creative Commons, please choose the appropriate license. If not this content cannot be shared.","keywordsExits":"Keywords already exists!","someKeywordsExits":"Some of these keywords already exist","width":"width","height":"height","rotateLeft":"Rotate Left","rotateRight":"Rotate Right","cropImage":"Crop Image","confirmCrop":"Confirm Crop","cancelCrop":"Cancel Crop"}},"hubIsEnabled":true,"reportingIsEnabled":false,"libraryConfig":null,"crossorigin":null,"crossoriginCacheBuster":null,"pluginCacheBuster":"?v=1.17.9","libraryUrl":"\/wp-content\/plugins\/h5p\/h5p-php-library\/js","contents":{"cid-8":{"library":"H5P.InteractiveBook 1.11","jsonContent":"{\"showCoverPage\":true,\"bookCover\":{\"coverDescription\":\"<p style=\\\"text-align:center;\\\">One of three HESCOR Comics which tackles the challenges of interdisciplinary work &amp; science in a lighthearted and funny way.<\\\/p>\",\"coverMedium\":{\"params\":{\"decorative\":false,\"contentName\":\"Image\",\"expandImage\":\"Expand Image\",\"minimizeImage\":\"Minimize Image\",\"file\":{\"path\":\"images\\\/image-A8VXXWo2.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":793,\"height\":1121},\"alt\":\"Comic_Cover\"},\"library\":\"H5P.Image 1.1\",\"metadata\":{\"contentType\":\"Image\",\"license\":\"U\",\"title\":\"Untitled Image\"},\"subContentId\":\"bd92e3f0-db05-442a-9747-02420a944ef3\"}},\"chapters\":[{\"params\":{\"content\":[{\"content\":{\"params\":{\"text\":\"<p style=\\\"text-align:center;\\\">In this short, interactive book, you will explore a comic that addresses the challenges of scientific interdisciplinary work through a playful story with unique characters. While the story itself is fictional, it is based on our research here at <a href=\\\"https:\\\/\\\/www.hescor-project.com\\\/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\">HESCOR<\\\/a>. In fact, <strong>any colored speech are based on quotations from HESCOR researchers on their understanding of our project and interdisciplinary work<\\\/strong>, to give you a real look inside how researchers must learn to communicate with one another!<\\\/p><hr><p style=\\\"text-align:center;\\\">Through this interactive book, you will not just see the comic itself, rather you will also be able to <strong>interact with the comic and its concepts more directly<\\\/strong>. This interactive book is designed to give you insight into HESCOR's interdisciplinary research and allow you to think more critically about some of the concepts through the comic and and a series of brief accompanying tasks.&nbsp;<\\\/p><hr><p style=\\\"text-align:center;\\\"><span style=\\\"font-size:1.5em;\\\">Thank you for checking out our comic!<\\\/span><\\\/p>\"},\"library\":\"H5P.AdvancedText 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"51f9488b-8971-4178-a116-c7ef5b035176\"},\"useSeparator\":\"auto\"}]},\"library\":\"H5P.Column 1.18\",\"subContentId\":\"54fbff9f-7d22-4722-9e52-7d1a98ccbd0b\",\"metadata\":{\"contentType\":\"Page\",\"license\":\"U\",\"title\":\"Introduction\"}},{\"params\":{\"content\":[{\"content\":{\"params\":{\"media\":{\"disableImageZooming\":false},\"answers\":[{\"correct\":true,\"tipsAndFeedback\":{\"tip\":\"\",\"chosenFeedback\":\"<div>Most of our infrastructure is made for our local climates. If our presumed, \\\"stable\\\" climate changes rapidly, our infrastructure can't keep up! This can lead to broken roads, railways, bridges, or energy infrastructure.<\\\/div>\",\"notChosenFeedback\":\"\"},\"text\":\"<div>breaking infrastructure&nbsp;<\\\/div>\"},{\"correct\":true,\"tipsAndFeedback\":{\"tip\":\"\",\"chosenFeedback\":\"<div>It is true, even though it might seem contradicting! The water cycle is really complex, and changing temperatures can cause lots of change in where water is when - plaguing areas with extreme weather creating too much or too little rain.&nbsp;<\\\/div>\",\"notChosenFeedback\":\"\"},\"text\":\"<div>water scarcity and flooding<\\\/div>\"},{\"correct\":true,\"tipsAndFeedback\":{\"tip\":\"\",\"chosenFeedback\":\"<div>Animals and plants will also experience climate change. Some species might be able to adapt or change their location, but there are also many species that can't and may become endangered or go extinct. Sensitive ecosystems are especially at risk, like the oceans.<\\\/div>\",\"notChosenFeedback\":\"\"},\"text\":\"<div>decreased biodiversity<\\\/div>\"},{\"correct\":true,\"tipsAndFeedback\":{\"tip\":\"\",\"chosenFeedback\":\"<div>While we know that the amount of rainfall might change, there are also extreme weather events like hurricanes and tornados that can increase or expand their \\\"usual\\\" range.<\\\/div>\",\"notChosenFeedback\":\"\"},\"text\":\"<div>extreme weather events<\\\/div>\"},{\"correct\":true,\"tipsAndFeedback\":{\"tip\":\"\",\"chosenFeedback\":\"<div>As we saw above, changes in the water cycle are likely. Most of our crops are sensitive to drastic weather changes and extreme weather events can lead to an increased loss of crops. Even fishing markets will be impacted due to their relationship with regional weather events like la Nina and el Nino!<\\\/div>\",\"notChosenFeedback\":\"\"},\"text\":\"<div>food supply chain risks<\\\/div>\"}],\"overallFeedback\":[{\"from\":0,\"to\":99,\"feedback\":\"Some are still missing!\"},{\"from\":100,\"to\":100,\"feedback\":\"Here are the main points from the IPCC Report 2023 about climate change https:\\\/\\\/www.ipcc.ch\\\/report\\\/ar6\\\/syr\\\/resources\\\/spm-headline-statements\\\/\"}],\"behaviour\":{\"enableRetry\":true,\"enableSolutionsButton\":true,\"enableCheckButton\":true,\"type\":\"auto\",\"singlePoint\":false,\"randomAnswers\":true,\"showSolutionsRequiresInput\":true,\"confirmCheckDialog\":false,\"confirmRetryDialog\":false,\"autoCheck\":false,\"passPercentage\":100,\"showScorePoints\":true},\"UI\":{\"checkAnswerButton\":\"Check\",\"submitAnswerButton\":\"Submit\",\"showSolutionButton\":\"Show solution\",\"tryAgainButton\":\"Retry\",\"tipsLabel\":\"Show tip\",\"scoreBarLabel\":\"You got :num out of :total points\",\"tipAvailable\":\"Tip available\",\"feedbackAvailable\":\"Feedback available\",\"readFeedback\":\"Read feedback\",\"wrongAnswer\":\"Wrong answer\",\"correctAnswer\":\"Correct answer\",\"shouldCheck\":\"Should have been checked\",\"shouldNotCheck\":\"Should not have been checked\",\"noInput\":\"Please answer before viewing the solution\",\"a11yCheck\":\"Check the answers. The responses will be marked as correct, incorrect, or unanswered.\",\"a11yShowSolution\":\"Show the solution. The task will be marked with its correct solution.\",\"a11yRetry\":\"Retry the task. Reset all responses and start the task over again.\"},\"confirmCheck\":{\"header\":\"Finish ?\",\"body\":\"Are you sure you wish to finish ?\",\"cancelLabel\":\"Cancel\",\"confirmLabel\":\"Finish\"},\"confirmRetry\":{\"header\":\"Retry ?\",\"body\":\"Are you sure you wish to retry ?\",\"cancelLabel\":\"Cancel\",\"confirmLabel\":\"Confirm\"},\"question\":\"<p>What are potential consequences of <strong>human-induced climate change<\\\/strong>?<\\\/p>\"},\"library\":\"H5P.MultiChoice 1.16\",\"metadata\":{\"contentType\":\"Multiple Choice\",\"license\":\"U\",\"title\":\"Human-induced climate change\"},\"subContentId\":\"2ab4a14f-9558-4e58-b84a-d4f886483b4b\"},\"useSeparator\":\"auto\"},{\"content\":{\"params\":{\"iconType\":\"icon\",\"icon\":\"info\",\"color\":\"#cb34cc\",\"hotspots\":[{\"position\":{\"x\":93.77289377289377,\"y\":62.091371608259706},\"alwaysFullscreen\":true,\"content\":[{\"params\":{\"text\":\"<p>It can be so much fun hanging out with friends and family! But socially connecting with others is not just about having fun - it's also a critical component of how people survive!&nbsp;<\\\/p><p><strong>Social connectivity allows people to bond with one another<\\\/strong>. Social connectivity has had lots of benefits for humans and their ancestors over millions of years, allowing them to <strong>mitigate environmental risks, maintain group cohesion and identity, share information and knowledge, and find mating partners.<\\\/strong><\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"aab58917-485b-4f83-b5b1-9fdf6bfd1292\"},{\"params\":{\"decorative\":false,\"contentName\":\"Image\",\"expandImage\":\"Expand Image\",\"minimizeImage\":\"Minimize Image\",\"file\":{\"path\":\"images\\\/image-nrkmt54g.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":1920,\"height\":1277},\"alt\":\"A small gathering of people\"},\"library\":\"H5P.Image 1.1\",\"metadata\":{\"contentType\":\"Image\",\"license\":\"U\",\"title\":\"Untitled Image\"},\"subContentId\":\"0a4d7e95-1c37-4025-8e90-327e9cfe0e28\"},{\"params\":{\"text\":\"<p><strong>Archaeologists can reconstruct social networks through time by looking at the distribution of raw materials<\\\/strong> (what objects are made out of).<\\\/p><p>Hunter-gatherer groups, like those from the Paleolithic (tens of thousands to millions of years ago) relied on social connections to maintain flexible networks across large landscapes, helping them share information, access resources, and cope with unpredictable environments. People collected raw materials they needed for the production of their every-day tools as they moved across the landscape (<strong>embedded procurement<\\\/strong>). The distribution of these materials can therefore reflect overlapping mobility ranges and give us an idea of how large territories were and where groups may have encountered one another.<\\\/p><p>In more sedentary Neolithic societies (thousands of years ago), social connectivity became more structured, supporting cooperation in farming, organizing exchange networks, and maintaining stable relationships between neighboring communities. Raw materials were often circulated through <strong>exchange networks<\\\/strong>. Materials could be passed from group to group over long distances, reflecting more formalized systems of interaction. These distribution patterns allow us to identify which communities were more closely connected within larger regional networks, and how social relationships were structured across increasingly sedentary populations.<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"2b1bdddf-d23a-45cb-b406-49a5c72f7a78\"},{\"params\":{\"decorative\":false,\"contentName\":\"Image\",\"expandImage\":\"Expand Image\",\"minimizeImage\":\"Minimize Image\",\"file\":{\"path\":\"images\\\/image-aYwrSgAP.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":587,\"height\":446},\"title\":\"https:\\\/\\\/scarf.scot\\\/national\\\/palaeolithic-mesolithic-panel-report\\\/6-lifestyles\\\/6-1-mesolithic-lifestyles\\\/\",\"alt\":\"Reconstruction of Mesolithic life at Holyrood Park, Edinburgh\"},\"library\":\"H5P.Image 1.1\",\"metadata\":{\"contentType\":\"Image\",\"license\":\"U\",\"title\":\"Untitled Image\"},\"subContentId\":\"1c655e01-4483-4991-a20d-4648f00d4b74\"}],\"header\":\"Socially Connecting\"},{\"position\":{\"x\":44.800000000000004,\"y\":5.021472628068266},\"alwaysFullscreen\":true,\"content\":[{\"params\":{\"text\":\"<p><strong>Global warming<\\\/strong> and <strong>climate change<\\\/strong> are related terms that people often use interchangeably, but they mean slightly different things.<\\\/p><p>Global warming refers specifically to the <strong>rise in Earth's average surface temperature<\\\/strong>. It describes the warming trend we have observed over the past century, mainly caused by human activities that release greenhouse gases like carbon dioxide into the atmosphere.<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"e71c1c3b-7d56-4400-9c6c-6b143f6b1fb1\"},{\"params\":{\"decorative\":false,\"contentName\":\"Image\",\"expandImage\":\"Expand Image\",\"minimizeImage\":\"Minimize Image\",\"file\":{\"path\":\"images\\\/image-6yhFFg6y.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":1220,\"height\":621},\"title\":\"https:\\\/\\\/www.blue-growth.org\\\/Global_Warming.htm\"},\"library\":\"H5P.Image 1.1\",\"metadata\":{\"contentType\":\"Image\",\"license\":\"U\",\"title\":\"Untitled Image\"},\"subContentId\":\"efd04854-3bce-45a2-b963-6cb0b7d4ea66\"},{\"params\":{\"text\":\"<p>Climate change is a broader term. It <strong>includes global warming but also covers other changes in climate <\\\/strong>that happen as a result of the general anthropogenic warming. This includes <strong>shifts in rainfall patterns, rising sea levels, more frequent extreme weather events, melting ice caps, and changes in ecosystems<\\\/strong>. So while global warming focuses on temperature, climate change describes the full range of environmental changes happening around the world.<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"6d4d7abc-4673-40c9-9f9a-bd79fedb5785\"}],\"header\":\"Climate Change vs. Global Warming\"}],\"hotspotNumberLabel\":\"Hotspot #num\",\"closeButtonLabel\":\"Close\",\"containsAudioVideoLabel\":\"Contains Audio\\\/Video\",\"image\":{\"path\":\"images\\\/image-rWb0HinG.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":1469,\"height\":2079}},\"library\":\"H5P.ImageHotspots 1.10\",\"metadata\":{\"contentType\":\"Image Hotspots\",\"license\":\"U\",\"title\":\"S1\"},\"subContentId\":\"16e1816c-50ca-4f24-bf97-b7d0cbe30271\"},\"useSeparator\":\"enabled\"}]},\"library\":\"H5P.Column 1.18\",\"subContentId\":\"878301fb-4cb6-4538-8fe5-ba6bb5c42097\",\"metadata\":{\"contentType\":\"Page\",\"license\":\"U\",\"title\":\"S1\"}},{\"params\":{\"content\":[{\"content\":{\"params\":{\"iconType\":\"icon\",\"icon\":\"info\",\"color\":\"#981d99\",\"hotspots\":[{\"position\":{\"x\":16.84981684981685,\"y\":43.9497667324139},\"alwaysFullscreen\":true,\"content\":[{\"params\":{\"visuals\":{\"fit\":false,\"controls\":false},\"playback\":{\"autoplay\":false,\"loop\":false},\"l10n\":{\"name\":\"Video\",\"loading\":\"Video player loading...\",\"noPlayers\":\"Found no video players that supports the given video format.\",\"noSources\":\"Video is missing sources.\",\"aborted\":\"Media playback has been aborted.\",\"networkFailure\":\"Network failure.\",\"cannotDecode\":\"Unable to decode media.\",\"formatNotSupported\":\"Video format not supported.\",\"mediaEncrypted\":\"Media encrypted.\",\"unknownError\":\"Unknown error.\",\"invalidYtId\":\"Invalid YouTube ID.\",\"unknownYtId\":\"Unable to find video with the given YouTube ID.\",\"restrictedYt\":\"The owner of this video does not allow it to be embedded.\"},\"sources\":[{\"path\":\"https:\\\/\\\/www.youtube.com\\\/watch?v=3sZFj4m7mnM\",\"mime\":\"video\\\/YouTube\",\"copyright\":{\"license\":\"U\"}}]},\"library\":\"H5P.Video 1.6\",\"metadata\":{\"contentType\":\"Video\",\"license\":\"U\",\"title\":\"HESCOR Introduction\"},\"subContentId\":\"fcafc145-b143-439c-868b-443d248c02d4\"}],\"header\":\"Interdisciplinary research\"},{\"position\":{\"x\":74.17582417582418,\"y\":55.99190028807839},\"alwaysFullscreen\":true,\"content\":[{\"params\":{\"text\":\"<p>Research starts with <strong>questions<\\\/strong>, not answers. Every discovery begins with curiosity about something. It could be anything, from how plants grow to why stars move the way they do. The important part is asking a question that you can actually investigate.<\\\/p><p>Once you have a question, you look for answers. This means <strong>forming ideas, testing them, collecting data, and analyzing the results<\\\/strong>. It takes time and effort. Researchers often try things that do not work, which is normal. Progress in science is not always smooth.<\\\/p><p>Then comes verification. Other researchers check the results through review and repetition. This helps ensure the findings are reliable before they become accepted knowledge.<\\\/p><p>But the process does not stop there. Every answer leads to new questions. Sometimes we find out our old ideas were wrong. Sometimes we just learn more details. Either way, research keeps going forward.<\\\/p><p>In short, research is not about reaching a final destination. <strong>Research is an ongoing process<\\\/strong>. The more we learn, the more we discover there is still unknown. That is why research continues to advance.<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"7e137e97-4c73-4aa9-91cb-3d78202a07be\"}],\"header\":\"Questioning ideas in science\"}],\"hotspotNumberLabel\":\"Hotspot #num\",\"closeButtonLabel\":\"Close\",\"containsAudioVideoLabel\":\"Contains Audio\\\/Video\",\"image\":{\"path\":\"images\\\/image-dcB89gfM.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":1469,\"height\":2079}},\"library\":\"H5P.ImageHotspots 1.10\",\"metadata\":{\"contentType\":\"Image Hotspots\",\"license\":\"U\",\"title\":\"S2\"},\"subContentId\":\"3bc208ff-7951-4842-8459-dc96cd2a70ea\"},\"useSeparator\":\"auto\"}]},\"library\":\"H5P.Column 1.18\",\"subContentId\":\"0f9c4a95-e64f-493c-9f2a-954c3d83e6df\",\"metadata\":{\"contentType\":\"Page\",\"license\":\"U\",\"title\":\"S2\"}},{\"params\":{\"content\":[{\"content\":{\"params\":{\"iconType\":\"icon\",\"icon\":\"info\",\"color\":\"#981d99\",\"hotspots\":[{\"position\":{\"x\":84.61538461538461,\"y\":47.03769947723872},\"alwaysFullscreen\":true,\"content\":[{\"params\":{\"text\":\"<p>Walking serves several purposes. Many people do it to connect with nature, while others see it primarily as exercise. Historically, however, walking was one of humanity\\u2019s most essential modes of transportation.<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"4fadd324-813b-4efa-af1e-82a64a7a18d8\"},{\"params\":{\"decorative\":false,\"contentName\":\"Image\",\"expandImage\":\"Expand Image\",\"minimizeImage\":\"Minimize Image\",\"file\":{\"path\":\"images\\\/image-go7YidDd.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":2034,\"height\":1165},\"alt\":\"A Changpa nomadic family in Tibet\"},\"library\":\"H5P.Image 1.1\",\"metadata\":{\"contentType\":\"Image\",\"license\":\"U\",\"title\":\"Untitled Image\"},\"subContentId\":\"38ecefac-a3a1-4a92-aefd-f64de6fcfa4b\"},{\"params\":{\"text\":\"<p><em>Changpa nomadic family living at the Changtang high-altitude plateau in Tibet (China) and Ladkha (India).<\\\/em><\\\/p><p>It is estimated that early humans covered <strong>15,000\\u201320,000 steps per day<\\\/strong>, mainly for hunting and gathering. Migration also played a major role. Even today nomadic groups still travel several kilometres each day on foot.<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"f28bcc63-cbee-4990-925f-89cba27f4dd1\"}],\"header\":\"Humans and long walks\"}],\"hotspotNumberLabel\":\"Hotspot #num\",\"closeButtonLabel\":\"Close\",\"containsAudioVideoLabel\":\"Contains Audio\\\/Video\",\"image\":{\"path\":\"images\\\/image-dX9nWxME.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":1469,\"height\":2079}},\"library\":\"H5P.ImageHotspots 1.10\",\"metadata\":{\"contentType\":\"Image Hotspots\",\"license\":\"U\",\"title\":\"S3\"},\"subContentId\":\"abd539fd-62ba-4ade-9802-0b37c047bc22\"},\"useSeparator\":\"auto\"},{\"content\":{\"params\":{\"questionnaireElements\":[{\"library\":{\"params\":{\"placeholderText\":\"Start writing...\",\"inputRows\":\"10\",\"question\":\"How do you like to cool off in the hot summer?\"},\"library\":\"H5P.OpenEndedQuestion },\"library\":\"H5P.DragQuestion 1.14\",\"metadata\":{\"contentType\":\"Drag and Drop\",\"license\":\"U\",\"title\":\"How long did it take each theory to be accepted?\"},\"subContentId\":\"c1313725-1396-4f20-9755-b355fd48a76b\"},\"useSeparator\":\"enabled\"}]},\"library\":\"H5P.Column 1.18\",\"subContentId\":\"6d0e4930-e3da-45b3-86e1-7701c385556d\",\"metadata\":{\"contentType\":\"Page\",\"license\":\"U\",\"title\":\"S4\"}},{\"params\":{\"content\":[{\"content\":{\"params\":{\"iconType\":\"icon\",\"icon\":\"info\",\"color\":\"#981d99\",\"hotspots\":[{\"position\":{\"x\":9.982174688057041,\"y\":19.633669733847828},\"alwaysFullscreen\":false,\"content\":[{\"params\":{\"text\":\"<p><strong>Proving theories<\\\/strong> and convincing researchers about your ideas can take a really long time - it takes a lot of patience and dialogue. We see this throughout the history of science! Ideas that we take for granted today like the fact that the earth moves around the sun (heliocentrism) or that we get sick from germs (germ theory) weren't even accepted for hundreds of years after the original researchers had died. Research is never finished! We keep working at our ideas if we believe we notice patterns and trust that there's a research community around us that will continue studying it - even if our time working on our research questions is over!<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"6132ab6b-a4bd-49d0-8966-fd3e971c23d2\"}],\"header\":\"Proving theories\"}],\"hotspotNumberLabel\":\"Hotspot #num\",\"closeButtonLabel\":\"Close\",\"containsAudioVideoLabel\":\"Contains Audio\\\/Video\",\"image\":{\"path\":\"images\\\/image-uoWvoSVG.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":1469,\"height\":2079}},\"library\":\"H5P.ImageHotspots 1.10\",\"metadata\":{\"contentType\":\"Image Hotspots\",\"license\":\"U\",\"title\":\"Seite 5\"},\"subContentId\":\"3c1
