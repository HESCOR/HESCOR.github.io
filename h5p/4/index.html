ense like Creative Commons, please choose the appropriate license. If not this content cannot be shared.","keywordsExits":"Keywords already exists!","someKeywordsExits":"Some of these keywords already exist","width":"width","height":"height","rotateLeft":"Rotate Left","rotateRight":"Rotate Right","cropImage":"Crop Image","confirmCrop":"Confirm Crop","cancelCrop":"Cancel Crop"}},"hubIsEnabled":true,"reportingIsEnabled":false,"libraryConfig":null,"crossorigin":null,"crossoriginCacheBuster":null,"pluginCacheBuster":"?v=1.17.9","libraryUrl":"\/wp-content\/plugins\/h5p\/h5p-php-library\/js","contents":{"cid-4":{"library":"H5P.InteractiveBook 1.11","jsonContent":"{\"showCoverPage\":false,\"bookCover\":{\"coverDescription\":\"<div class=\\\"table-overflow-protection\\\"><\\\/div>\",\"coverMedium\":{\"params\":{\"decorative\":false,\"contentName\":\"Image\",\"expandImage\":\"Expand Image\",\"minimizeImage\":\"Minimize Image\",\"file\":{\"path\":\"images\\\/image-GBP3lowA.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":793,\"height\":1121},\"alt\":\"Comic_Cover\"},\"library\":\"H5P.Image 1.1\",\"metadata\":{\"contentType\":\"Image\",\"license\":\"U\",\"title\":\"Untitled Image\"},\"subContentId\":\"d68285aa-1c54-4302-bcd3-c96578f613df\"}},\"chapters\":[{\"params\":{\"content\":[{\"content\":{\"params\":{\"text\":\"<p style=\\\"text-align:center;\\\">In this short, interactive book, you will explore a comic that addresses the challenges of scientific interdisciplinary work through a playful story with unique characters. While the story itself is fictional, it is based on our research here at <a href=\\\"https:\\\/\\\/www.hescor-project.com\\\/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\">HESCOR<\\\/a>. In fact, <strong>any colored speech are based on quotations from HESCOR researchers on their understanding of our project and interdisciplinary work<\\\/strong>, to give you a real look inside how researchers must learn to communicate with one another!<\\\/p><hr><p style=\\\"text-align:center;\\\">Through this interactive book, you will not just see the comic itself, rather you will also be able to <strong>interact with the comic and its concepts more directly<\\\/strong>. This interactive book is designed to give you insight into HESCOR's interdisciplinary research and allow you to think more critically about some of the concepts through the comic and and a series of brief accompanying tasks.&nbsp;<\\\/p><hr><p style=\\\"text-align:center;\\\"><span style=\\\"font-size:1.5em;\\\">Thank you for checking out our comic!<\\\/span><\\\/p>\"},\"library\":\"H5P.AdvancedText 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"c10ab1fb-04c2-4acc-adba-b1d8a79ac62b\"},\"useSeparator\":\"auto\"}]},\"library\":\"H5P.Column 1.18\",\"subContentId\":\"528fb122-e591-444a-9e51-d6a67168a2a9\",\"metadata\":{\"contentType\":\"Page\",\"license\":\"U\",\"title\":\"Introduction\"}},{\"params\":{\"content\":[{\"content\":{\"params\":{\"media\":{\"disableImageZooming\":false},\"answers\":[{\"correct\":false,\"tipsAndFeedback\":{\"tip\":\"\",\"chosenFeedback\":\"<div>Hm, the word \\\"potential\\\" hints that we might be talking about some kind of likelihood<\\\/div>\",\"notChosenFeedback\":\"\"},\"text\":\"<div>The strength of humans when they work together<\\\/div>\"},{\"correct\":false,\"tipsAndFeedback\":{\"tip\":\"\",\"chosenFeedback\":\"<div>Hm, the word \\\"potential\\\" hints that we might be talking about some kind of likelihood<\\\/div>\",\"notChosenFeedback\":\"\"},\"text\":\"<div>An index that quantifies the genetic diversity of human populations globally<\\\/div>\"},{\"correct\":false,\"tipsAndFeedback\":{\"tip\":\"\",\"chosenFeedback\":\"<div>Hm, the word \\\"potential\\\" hints that we might be talking about some kind of likelihood<\\\/div>\",\"notChosenFeedback\":\"\"},\"text\":\"<div>A metric that assesses the technological sophistication of archaeological cultures based on the kinds of stone tools that they have<\\\/div>\"},{\"correct\":true,\"tipsAndFeedback\":{\"tip\":\"\",\"chosenFeedback\":\"<div>Right! Our researchers like Dr. Christian Wegener and Dr. Annika Vogel use different parameters to try to estimate where it might have been easiest for humans to live in the past!<\\\/div>\",\"notChosenFeedback\":\"\"},\"text\":\"<div>A statistical measure estimating the likelihood that past human groups could live somewhere based on climate, resource availability, and environments<\\\/div>\"}],\"overallFeedback\":[{\"from\":0,\"to\":100}],\"behaviour\":{\"enableRetry\":true,\"enableSolutionsButton\":true,\"enableCheckButton\":true,\"type\":\"auto\",\"singlePoint\":false,\"randomAnswers\":true,\"showSolutionsRequiresInput\":true,\"confirmCheckDialog\":false,\"confirmRetryDialog\":false,\"autoCheck\":false,\"passPercentage\":100,\"showScorePoints\":true},\"UI\":{\"checkAnswerButton\":\"Check\",\"submitAnswerButton\":\"Submit\",\"showSolutionButton\":\"Show solution\",\"tryAgainButton\":\"Retry\",\"tipsLabel\":\"Show tip\",\"scoreBarLabel\":\"You got :num out of :total points\",\"tipAvailable\":\"Tip available\",\"feedbackAvailable\":\"Feedback available\",\"readFeedback\":\"Read feedback\",\"wrongAnswer\":\"Wrong answer\",\"correctAnswer\":\"Correct answer\",\"shouldCheck\":\"Should have been checked\",\"shouldNotCheck\":\"Should not have been checked\",\"noInput\":\"Please answer before viewing the solution\",\"a11yCheck\":\"Check the answers. The responses will be marked as correct, incorrect, or unanswered.\",\"a11yShowSolution\":\"Show the solution. The task will be marked with its correct solution.\",\"a11yRetry\":\"Retry the task. Reset all responses and start the task over again.\"},\"confirmCheck\":{\"header\":\"Finish ?\",\"body\":\"Are you sure you wish to finish ?\",\"cancelLabel\":\"Cancel\",\"confirmLabel\":\"Finish\"},\"confirmRetry\":{\"header\":\"Retry ?\",\"body\":\"Are you sure you wish to retry ?\",\"cancelLabel\":\"Cancel\",\"confirmLabel\":\"Confirm\"},\"question\":\"<p>What do you think <strong>human existence potential<\\\/strong> might be?&nbsp;<\\\/p>\"},\"library\":\"H5P.MultiChoice 1.16\",\"metadata\":{\"contentType\":\"Multiple Choice\",\"license\":\"U\",\"title\":\"Human Existence Potential\"},\"subContentId\":\"2058fd73-87f6-43b5-9f10-b6d2ff291ae7\"},\"useSeparator\":\"auto\"},{\"content\":{\"params\":{\"iconType\":\"icon\",\"icon\":\"info\",\"color\":\"#17b3a1\",\"hotspots\":[{\"position\":{\"x\":52.27655986509275,\"y\":31.1215913750886},\"alwaysFullscreen\":true,\"content\":[{\"params\":{\"text\":\"<p>The <strong>Human Existence Potential (HEP)<\\\/strong> is an estimation of the <em>ability for people to live at a certain place during a certain time<\\\/em>. To do this, we combine a lot of different aspects that can impact where someone might decide to live like <em>environmental, cultural, technological, and social preferences<\\\/em>. Because this process is complex and can be different at certain locations or during certain times, it is always a simplification - but a great example of interdisciplinary research in HESCOR, where researchers with different expertise come together to define one quantity that considers all these different aspects!<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"cb08fdf6-4ec9-40c9-a136-b71205b1bb95\"},{\"params\":{\"decorative\":false,\"contentName\":\"Image\",\"expandImage\":\"Expand Image\",\"minimizeImage\":\"Minimize Image\",\"file\":{\"path\":\"images\\\/image-1O49SPNB.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":1280,\"height\":720},\"alt\":\"Image about climate change\"},\"library\":\"H5P.Image 1.1\",\"metadata\":{\"contentType\":\"Image\",\"license\":\"CC BY\",\"title\":\"Simplified HEP\",\"authors\":[{\"name\":\"Boqiang Huang\",\"role\":\"Originator\"},{\"name\":\"Annika Vogel\",\"role\":\"Originator\"},{\"name\":\"Helen Hoffman\",\"role\":\"Author\"},{\"name\":\"Elena Robakiewicz\",\"role\":\"Editor\"}],\"licenseVersion\":\"4.0\",\"yearFrom\":2026,\"licenseExtras\":\"Map taken from Klein et al. 2021\"},\"subContentId\":\"84d8baa0-f5a1-4624-8127-4bce7f387ee5\"},{\"params\":{\"text\":\"<p>Environmental preferences like <strong>local climate, vegetation, and topography<\\\/strong> are important factors for survival of early humans. But even if environmental conditions are ideal, <em>there may be other reasons why humans might choose not to live there<\\\/em>. That\\u2019s why we also include <strong>technological capability<\\\/strong> (e.g. to survive harsh conditions or access available food resources) and <strong>cultural preferences<\\\/strong> (e.g. traditional preferences or interaction with other inhabitants).<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"337aea9c-623a-409c-8ab1-34024e185146\"},{\"params\":{\"text\":\"<p>More information about the h<em>uman existence potential<\\\/em> - <strong>HEP<\\\/strong><\\\/p><p><a href=\\\"https:\\\/\\\/doi.org\\\/10.1016\\\/j.quaint.2020.07.046\\\">https:\\\/\\\/doi.org\\\/10.1016\\\/j.quaint.2020.07.046<\\\/a>, S.9&nbsp;<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"a7c08b5f-e4fb-4203-bcba-8b4b41cdebf2\"}],\"header\":\"Human Existence Potential (HEP)\"},{\"position\":{\"x\":36.08768971332209,\"y\":81.72947862024174},\"alwaysFullscreen\":false,\"content\":[{\"params\":{\"visuals\":{\"fit\":true,\"controls\":true},\"playback\":{\"autoplay\":false,\"loop\":false},\"l10n\":{\"name\":\"Video\",\"loading\":\"Video player loading...\",\"noPlayers\":\"Found no video players that supports the given video format.\",\"noSources\":\"Video is missing sources.\",\"aborted\":\"Media playback has been aborted.\",\"networkFailure\":\"Network failure.\",\"cannotDecode\":\"Unable to decode media.\",\"formatNotSupported\":\"Video format not supported.\",\"mediaEncrypted\":\"Media encrypted.\",\"unknownError\":\"Unknown error.\",\"invalidYtId\":\"Invalid YouTube ID.\",\"unknownYtId\":\"Unable to find video with the given YouTube ID.\",\"restrictedYt\":\"The owner of this video does not allow it to be embedded.\"},\"sources\":[{\"path\":\"https:\\\/\\\/www.youtube.com\\\/watch?v=3sZFj4m7mnM\",\"mime\":\"video\\\/YouTube\",\"copyright\":{\"license\":\"U\"}}]},\"library\":\"H5P.Video 1.6\",\"metadata\":{\"contentType\":\"Video\",\"license\":\"U\",\"title\":\"HESCOR_Introduction_3min\"},\"subContentId\":\"cda4142f-63ef-44df-8490-fd6bf8e92468\"}],\"header\":\"Interdisciplinary Research\"}],\"hotspotNumberLabel\":\"Hotspot #num\",\"closeButtonLabel\":\"Close\",\"containsAudioVideoLabel\":\"Contains Audio\\\/Video\",\"image\":{\"path\":\"images\\\/image-xm2BTiWU.png\",\"mime\":\"image\\\/png\",\"copyright\":{\"license\":\"U\"},\"width\":827,\"height\":1169}},\"library\":\"H5P.ImageHotspots 1.10\",\"metadata\":{\"contentType\":\"Image Hotspots\",\"license\":\"U\",\"title\":\"S1\"},\"subContentId\":\"085c897d-1318-4c8e-b1fa-fc88cc6683ed\"},\"useSeparator\":\"enabled\"}]},\"library\":\"H5P.Column 1.18\",\"subContentId\":\"546e4f86-a566-4892-9abb-ef51e7a68186\",\"metadata\":{\"contentType\":\"Page\",\"license\":\"U\",\"title\":\"S1\"}},{\"params\":{\"content\":[{\"content\":{\"params\":{\"iconType\":\"icon\",\"icon\":\"info\",\"color\":\"#17b3a1\",\"hotspots\":[{\"position\":{\"x\":86.17200674536257,\"y\":16.069596808028997},\"alwaysFullscreen\":true,\"content\":[{\"params\":{\"text\":\"<p><strong>Interdisciplinary research<\\\/strong> brings together <em>ideas<\\\/em>, <em>methods<\\\/em>, <em>tools<\\\/em>, and<em> research<\\\/em> from multiple academic fields. Researchers work together across disciplines <strong>to tackle problems that are more complex than one single discipline<\\\/strong>. It\\u2019s valuable because it creates more comprehensive insights, sparks innovative solutions, and makes research outcomes more relevant to real\\u2011world challenges. To be successful, researchers need to collaborate to merge diverse academic viewpoints. It can be difficult to overcome challenges in combining differing methodologies and data types, especially between natural sciences, social sciences, and the humanities.&nbsp;<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"f864813c-9247-4106-9fdf-25c93334899f\"},{\"params\":{\"decorative\":false,\"contentName\":\"Image\",\"expandImage\":\"Expand Image\",\"minimizeImage\":\"Minimize Image\",\"file\":{\"path\":\"images\\\/image-Kr2YUwCu.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":4000,\"height\":3000},\"alt\":\"Schematic showing people sharing ideas with one another\"},\"library\":\"H5P.Image 1.1\",\"metadata\":{\"contentType\":\"Image\",\"license\":\"U\",\"title\":\"Interdisciplinarity and the 21st century research-intensive university\",\"authors\":[{\"name\":\"Didier Wernli\",\"role\":\"Author\"},{\"name\":\"Fr\\u00e9d\\u00e9ric Darbellay\",\"role\":\"Author\"},{\"name\":\"Katrien Maes\",\"role\":\"Author\"}],\"source\":\"https:\\\/\\\/www.leru.org\\\/publications\\\/interdisciplinarity-and-the-21st-century-research-intensive-university\",\"yearFrom\":2016},\"subContentId\":\"691626f0-19b6-44a8-b446-678fc4bf73c3\"},{\"params\":{\"text\":\"<p><a href=\\\"https:\\\/\\\/www.hescor-project.com\\\/members\\\/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\">HESCOR researchers<\\\/a> are from Mathematics, Geophysics and Meteorology, Prehistoric Archaeology, Geography Education, and Multidisciplinary Environmental Studies in the Humanities at the University of Cologne. Plus more researchers from other universities!<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"85c81e29-c4e0-4ca5-ae11-4484fc9f4621\"}],\"header\":\"Interdisciplinary Research\"},{\"position\":{\"x\":38.785834738617204,\"y\":86.34155938663716},\"alwaysFullscreen\":true,\"content\":[{\"params\":{\"text\":\"<p>Models are powerful and flexible tools for scientific research. <a href=\\\"https:\\\/\\\/www.hescor-project.com\\\/2025\\\/11\\\/12\\\/what-is-a-good-model\\\/\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\">Models are used for very different purposes like exploring, specifying, testing, explaining, or generalizing.<\\\/a> Models can be very flexible: a big advantage when you want to study lots of different scientific questions!&nbsp;<\\\/p><p>But, this flexibility means that the same model could produce very different outcomes based on its <strong>parameters<\\\/strong>. Model parameters are variables put into a model that determine its behavior. For example, if you wanted to know how temperature changes with an increase in CO2 in the atmosphere, one could use conditions from 1950 (280 parts per million) and the second from today (427 parts per million). Your study would compare both models to learn about CO2's impact!<\\\/p><p>It's therefore a really big deal for modellers to understand their model parameters! They make those selections either qualitatively, (from expert knowledge), or quantitatively (from known data). Their choices of what they put in makes all the difference of what the model spits out!<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"cb31cafb-2066-44ef-9add-c95a6990be28\"},{\"params\":{\"decorative\":false,\"contentName\":\"Image\",\"expandImage\":\"Expand Image\",\"minimizeImage\":\"Minimize Image\",\"file\":{\"path\":\"images\\\/image-LWCGslCJ.png\",\"mime\":\"image\\\/png\",\"copyright\":{\"license\":\"U\"},\"width\":1123,\"height\":794},\"alt\":\"A loop describing the process in order to create a model. Question to requirements to data and methods to processes and assumptions to implication to calibration to validation to application\"},\"library\":\"H5P.Image 1.1\",\"metadata\":{\"contentType\":\"Image\",\"license\":\"CC BY\",\"title\":\"Modelling Scheme\",\"authors\":[{\"name\":\"Annika Vogel\",\"role\":\"Author\"}],\"licenseVersion\":\"4.0\",\"yearFrom\":2025},\"subContentId\":\"832af4ea-6252-4212-b318-f8f28809a66c\"},{\"params\":{\"text\":\"<p>Scientific models are constantly rebuilt in a cycle of development:&nbsp;<br><strong>(0)<\\\/strong> Define a research question.<br><strong>(1)<\\\/strong> Figure out what you need to answer the question.<br><strong>(2)<\\\/strong> Gather the data and methods you need.<br><strong>(3) <\\\/strong>Write down how the model works (processes) and the choices you made while building it (assumptions).&nbsp;<br><strong>(4)<\\\/strong> Build (implement) the model into a mathematical or computational framework.<br><strong>(5)<\\\/strong> Update (calibrate) the model parameters based on your research question.<br><strong>(6)<\\\/strong> Compare (validate) the model outcomes to other data. Here you might have to restart!<br><strong>(7) <\\\/strong>Apply the model to the research question.<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"652c31a2-0840-4425-a5f8-7345eeb97592\"}],\"header\":\"How are models made?\"}],\"hotspotNumberLabel\":\"Hotspot #num\",\"closeButtonLabel\":\"Close\",\"containsAudioVideoLabel\":\"Contains Audio\\\/Video\",\"backgroundImageAltText\":\"second Comic image\",\"image\":{\"path\":\"images\\\/image-3oAk92d6.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":1469,\"height\":2079}},\"library\":\"H5P.ImageHotspots 1.10\",\"metadata\":{\"contentType\":\"Image Hotspots\",\"license\":\"U\",\"title\":\"S2\"},\"subContentId\":\"bcd5b4c2-793f-41e3-9f2d-a8e98e76ca86\"},\"useSeparator\":\"auto\"}]},\"library\":\"H5P.Column 1.18\",\"subContentId\":\"e85df5b8-b8bc-4c48-be52-7491a7b8fc5e\",\"metadata\":{\"contentType\":\"Page\",\"license\":\"U\",\"title\":\"S2\"}},{\"params\":{\"content\":[{\"content\":{\"params\":{\"media\":{\"disableImageZooming\":false},\"answers\":[{\"correct\":false,\"tipsAndFeedback\":{\"tip\":\"\",\"chosenFeedback\":\"\",\"notChosenFeedback\":\"\"},\"text\":\"<div>Scientific laws and theories are the same<\\\/div>\"},{\"correct\":true,\"tipsAndFeedback\":{\"tip\":\"\",\"chosenFeedback\":\"<div>Theories try to describe <em>how <\\\/em>the world works and have evidence to help back it up!<\\\/div>\",\"notChosenFeedback\":\"\"},\"text\":\"<div>Scientific theories are explanations of the world that have been tested using the scientific method.&nbsp;<\\\/div>\"},{\"correct\":false,\"tipsAndFeedback\":{\"tip\":\"\",\"chosenFeedback\":\"<div>Even though we tend to use \\\"theory\\\" to describe an idea, in science it needs to have some evidence!<\\\/div>\",\"notChosenFeedback\":\"\"},\"text\":\"<div>Scientific theories indicate that researchers still have doubt about whether or not they are true.<\\\/div>\"},{\"correct\":true,\"tipsAndFeedback\":{\"tip\":\"\",\"chosenFeedback\":\"<div>A law can often predict how something might happen, like the law of gravity!<\\\/div>\",\"notChosenFeedback\":\"\"},\"text\":\"<div>Laws are mathematical rules that can explain something we see in the world.<\\\/div>\"}],\"overallFeedback\":[{\"from\":0,\"to\":100}],\"behaviour\":{\"enableRetry\":true,\"enableSolutionsButton\":true,\"enableCheckButton\":true,\"type\":\"auto\",\"singlePoint\":false,\"randomAnswers\":true,\"showSolutionsRequiresInput\":true,\"confirmCheckDialog\":false,\"confirmRetryDialog\":false,\"autoCheck\":false,\"passPercentage\":100,\"showScorePoints\":true},\"UI\":{\"checkAnswerButton\":\"Check\",\"submitAnswerButton\":\"Submit\",\"showSolutionButton\":\"Show solution\",\"tryAgainButton\":\"Retry\",\"tipsLabel\":\"Show tip\",\"scoreBarLabel\":\"You got :num out of :total points\",\"tipAvailable\":\"Tip available\",\"feedbackAvailable\":\"Feedback available\",\"readFeedback\":\"Read feedback\",\"wrongAnswer\":\"Wrong answer\",\"correctAnswer\":\"Correct answer\",\"shouldCheck\":\"Should have been checked\",\"shouldNotCheck\":\"Should not have been checked\",\"noInput\":\"Please answer before viewing the solution\",\"a11yCheck\":\"Check the answers. The responses will be marked as correct, incorrect, or unanswered.\",\"a11yShowSolution\":\"Show the solution. The task will be marked with its correct solution.\",\"a11yRetry\":\"Retry the task. Reset all responses and start the task over again.\"},\"confirmCheck\":{\"header\":\"Finish ?\",\"body\":\"Are you sure you wish to finish ?\",\"cancelLabel\":\"Cancel\",\"confirmLabel\":\"Finish\"},\"confirmRetry\":{\"header\":\"Retry ?\",\"body\":\"Are you sure you wish to retry ?\",\"cancelLabel\":\"Cancel\",\"confirmLabel\":\"Confirm\"},\"question\":\"<p>Mark all <strong>correct<\\\/strong> sentences.<\\\/p>\"},\"library\":\"H5P.MultiChoice 1.16\",\"metadata\":{\"contentType\":\"Multiple Choice\",\"license\":\"U\",\"title\":\"What are the differences between scientific laws and scientific theories?\"},\"subContentId\":\"cf8d8d11-0385-4357-8158-3961017596f9\"},\"useSeparator\":\"auto\"},{\"content\":{\"params\":{\"iconType\":\"icon\",\"icon\":\"info\",\"color\":\"#17b3a1\",\"hotspots\":[{\"position\":{\"x\":5.227655986509275,\"y\":8.602859345629351},\"alwaysFullscreen\":false,\"content\":[{\"params\":{\"visuals\":{\"fit\":true,\"controls\":true},\"playback\":{\"autoplay\":false,\"loop\":false},\"l10n\":{\"name\":\"Video\",\"loading\":\"Video player loading...\",\"noPlayers\":\"Found no video players that supports the given video format.\",\"noSources\":\"Video is missing sources.\",\"aborted\":\"Media playback has been aborted.\",\"networkFailure\":\"Network failure.\",\"cannotDecode\":\"Unable to decode media.\",\"formatNotSupported\":\"Video format not supported.\",\"mediaEncrypted\":\"Media encrypted.\",\"unknownError\":\"Unknown error.\",\"invalidYtId\":\"Invalid YouTube ID.\",\"unknownYtId\":\"Unable to find video with the given YouTube ID.\",\"restrictedYt\":\"The owner of this video does not allow it to be embedded.\"},\"sources\":[{\"path\":\"https:\\\/\\\/www.youtube.com\\\/watch?v=GyN2RhbhiEU\",\"mime\":\"video\\\/YouTube\",\"copyright\":{\"license\":\"U\"}}]},\"library\":\"H5P.Video 1.6\",\"metadata\":{\"contentType\":\"Video\",\"license\":\"U\",\"title\":\"What\\u2019s the difference between a scientific law and theory?\"},\"subContentId\":\"8654ae8a-6240-426d-aa04-1731d28482a3\"},{\"params\":{\"text\":\"<p>In science, a <strong>theory<\\\/strong> is a well\\u2011tested, coherent set of principles and explanations that unites many observations and predicts new ones. You can think of it as the most reliable, evidence\\u2011based framework we have for understanding a phenomenon.&nbsp;<\\\/p><p>In the humanities, a theory can be a systematic form of thinking based off of contemplative or logical reasoning. Theories can provide a <strong>lens<\\\/strong> which is a viewpoint or conceptual filter that researchers use to focus on certain aspects of a problem. Just as a physical lens shapes and clarifies light, a theoretical lens shapes how data are interpreted and <strong>which questions are considered important<\\\/strong>.<\\\/p><p>&nbsp;<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"f02650f3-9bfa-44a3-854a-03f04e2c8f61\"}],\"header\":\"What are scientific theories?\"}],\"hotspotNumberLabel\":\"Hotspot #num\",\"closeButtonLabel\":\"Close\",\"containsAudioVideoLabel\":\"Contains Audio\\\/Video\",\"image\":{\"path\":\"images\\\/image-1sudGBVi.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":1469,\"height\":2079}},\"library\":\"H5P.ImageHotspots 1.10\",\"metadata\":{\"contentType\":\"Image Hotspots\",\"license\":\"U\",\"title\":\"S3\"},\"subContentId\":\"e888a731-4ab4-4012-9b3b-5d396eba3083\"},\"useSeparator\":\"enabled\"}]},\"library\":\"H5P.Column 1.18\",\"subContentId\":\"efa2437d-caea-4f69-a3da-7bb2360b76a5\",\"metadata\":{\"contentType\":\"Page\",\"license\":\"U\",\"title\":\"S3\"}},{\"params\":{\"content\":[{\"content\":{\"params\":{\"iconType\":\"icon\",\"icon\":\"info\",\"color\":\"#17b3a1\",\"hotspots\":[{\"position\":{\"x\":56.39999999999999,\"y\":29.848005975523762},\"alwaysFullscreen\":true,\"content\":[{\"params\":{\"decorative\":false,\"contentName\":\"Image\",\"expandImage\":\"Expand Image\",\"minimizeImage\":\"Minimize Image\",\"file\":{\"path\":\"images\\\/image-oDGT3a0d.png\",\"mime\":\"image\\\/png\",\"copyright\":{\"license\":\"U\"},\"width\":960,\"height\":720},\"alt\":\"Research workflow cycle from discovery to data collection to analysis to writing to publication to outreach and impact back to discovery. All categories have their own loops\"},\"library\":\"H5P.Image 1.1\",\"metadata\":{\"contentType\":\"Image\",\"license\":\"U\",\"title\":\"Basic Research Workflow\",\"source\":\"https:\\\/\\\/eps-libraries-berkeley.github.io\\\/volt\\\/Introduction\\\/research_workflows.html\"},\"subContentId\":\"5ede9b95-79b6-4ff2-9c1b-70532371bf8a\"},{\"params\":{\"text\":\"<p>Research can have various methods, but often the workflow follows <strong>the scientific method<\\\/strong>:&nbsp;<\\\/p><ol><li>Ask a question<\\\/li><li>Do some background research to see if the question has already been answered (this can allow you to refine your question)<\\\/li><li>Construct a hypothesis<\\\/li><li>Test the hypothesis with an experiment, through data collection, or other form of research<\\\/li><li>Analyze and interpret data<\\\/li><li>Compare your data with other data<\\\/li><li>Communicate results<\\\/li><\\\/ol>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"ad101c60-7dd6-4472-b532-c5c953d36089\"}],\"header\":\"Research Workflow\"},{\"position\":{\"x\":5.564924114671164,\"y\":59.14130148789559},\"alwaysFullscreen\":false,\"content\":[{\"params\":{\"text\":\"<p><strong>Interdisciplinary research<\\\/strong> is crucial because many real\\u2011world problems (like climate change, pandemics, and sustainable technology) span multiple domains. Combining expertise from different fields yields <em>more comprehensive insights<\\\/em>, <em>sparks new solutions<\\\/em>, and <em>increases the societal impact<\\\/em> of scientific discoveries.<\\\/p>\"},\"library\":\"H5P.Text 1.1\",\"metadata\":{\"contentType\":\"Text\",\"license\":\"U\",\"title\":\"Untitled Text\"},\"subContentId\":\"dab3a982-b9f0-435e-bc8c-4b95dfcb0bcb\"},{\"params\":{\"decorative\":false,\"contentName\":\"Image\",\"expandImage\":\"Expand Image\",\"minimizeImage\":\"Minimize Image\",\"alt\":\"HESCOR&#039;s web that shows the connection across all of the different departments\",\"file\":{\"path\":\"images\\\/image-Dj1wPwr8.png\",\"mime\":\"image\\\/png\",\"copyright\":{\"license\":\"U\"},\"width\":3737,\"height\":3013}},\"library\":\"H5P.Image 1.1\",\"metadata\":{\"contentType\":\"Image\",\"license\":\"U\",\"title\":\"HESCOR Web\",\"authors\":[{\"name\":\"Johanna Hilpert\",\"role\":\"Author\"}],\"yearFrom\":2025},\"subContentId\":\"82cb8dce-4740-4920-aebe-94570861abda\"}],\"header\":\"Addressing the World&#039;s Biggest Problems\"}],\"hotspotNumberLabel\":\"Hotspot #num\",\"closeButtonLabel\":\"Close\",\"containsAudioVideoLabel\":\"Contains Audio\\\/Video\",\"image\":{\"path\":\"images\\\/image-klSwrljf.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":1469,\"height\":2079}},\"library\":\"H5P.ImageHotspots 1.10\",\"metadata\":{\"contentType\":\"Image Hotspots\",\"license\":\"U\",\"title\":\"S4\"},\"subContentId\":\"d3a7708b-09f9-4718-a945-b092607542b5\"},\"useSeparator\":\"enabled\"},{\"content\":{\"params\":{\"media\":{\"disableImageZooming\":false},\"text\":\"<p><strong>Fill<\\\/strong> in the <strong>missing words<\\\/strong>. What is the typical order for research?<\\\/p>\",\"overallFeedback\":[{\"from\":0,\"to\":100}],\"showSolutions\":\"Show solution\",\"tryAgain\":\"Retry\",\"checkAnswer\":\"Check\",\"submitAnswer\":\"Submit\",\"notFilledOut\":\"Please fill in all blanks to view solution\",\"answerIsCorrect\":\"&#039;:ans&#039; is correct\",\"answerIsWrong\":\"&#039;:ans&#039; is wrong\",\"answeredCorrectly\":\"Answered correctly\",\"answeredIncorrectly\":\"Answered incorrectly\",\"solutionLabel\":\"Correct answer:\",\"inputLabel\":\"Blank input @num of @total\",\"inputHasTipLabel\":\"Tip available\",\"tipLabel\":\"Tip\",\"behaviour\":{\"enableRetry\":true,\"enableSolutionsButton\":true,\"enableCheckButton\":true,\"autoCheck\":false,\"caseSensitive\":true,\"showSolutionsRequiresInput\":true,\"separateLines\":false,\"confirmCheckDialog\":false,\"confirmRetryDialog\":false,\"acceptSpellingErrors\":false},\"scoreBarLabel\":\"You got :num out of :total points\",\"a11yCheck\":\"Check the answers. The responses will be marked as correct, incorrect, or unanswered.\",\"a11yShowSolution\":\"Show the solution. The task will be marked with its correct solution.\",\"a11yRetry\":\"Retry the task. Reset all responses and start the task over again.\",\"a11yCheckingModeHeader\":\"Checking mode\",\"confirmCheck\":{\"header\":\"Finish ?\",\"body\":\"Are you sure you wish to finish ?\",\"cancelLabel\":\"Cancel\",\"confirmLabel\":\"Finish\"},\"confirmRetry\":{\"header\":\"Retry ?\",\"body\":\"Are you sure you wish to retry ?\",\"cancelLabel\":\"Cancel\",\"confirmLabel\":\"Confirm\"},\"questions\":[\"<p>The research journey begins with <strong>*discovery*<\\\/strong>, the moment you recognize a question worth pursuing. To ground your idea, you move on to *<strong>data collection*<\\\/strong>, reviewing existing literature and prior work to see what\\u2019s already known. With that <strong>*foundation*<\\\/strong> you plan your <strong>*analysis*<\\\/strong>, deciding which measurements, surveys, or experiments will generate the evidence you need. After gathering the raw material, you conduct <strong>*tests*<\\\/strong>, turning numbers and observations into meaningful patterns and conclusions. The next phase is *<strong>writing*<\\\/strong>, where you organize, craft figures, and write a manuscript that clearly conveys what you discovered. Once the manuscript is polished, you aim for <strong>*publication*<\\\/strong>, submitting it to a journal, repository, or conference so the broader community can evaluate and build on your work. Finally, you consider <strong>*outreach*<\\\/strong>, thinking about how to share the findings beyond academia. Either through talks, media outreach, or other channels that maximize impact.<\\\/p>\",\"<p><strong>Words<\\\/strong>: outreach, analysis, writing, publication, tests, foundation, data collection, discovery.<\\\/p>\"]},\"library\":\"H5P.Blanks 1.14\",\"metadata\":{\"contentType\":\"Fill in the Blanks\",\"license\":\"U\",\"title\":\"Review of Scientific Method\"},\"subContentId\":\"7267bfae-761e-496a-86a4-c9eb6e8acb26\"},\"useSeparator\":\"enabled\"}]},\"library\":\"H5P.Column 1.18\",\"subContentId\":\"b9f9f303-d5fc-43c7-84ce-aad0ca653572\",\"metadata\":{\"contentType\":\"Page\",\"license\":\"U\",\"title\":\"S4\"}},{\"params\":{\"content\":[{\"content\":{\"params\":{\"decorative\":false,\"contentName\":\"Image\",\"expandImage\":\"Expand Image\",\"minimizeImage\":\"Minimize Image\",\"title\":\"S5\",\"alt\":\"S5\",\"file\":{\"path\":\"images\\\/image-55spYYHZ.jpg\",\"mime\":\"image\\\/jpeg\",\"copyright\":{\"license\":\"U\"},\"width\":1469,\"height\":2079}},\"library\":\"H5P.Image 1.1\",\"metadata\":{\"contentType\":\"Image\",\"license\":\"U\",\"title\":\"Untitled Image\"},\"subContentId\":\"ffddcccd-d83f-4851-9c12-dafdb6b494a6\"},\"useSeparator\":\"auto\"}]},\"library\":\"H5P.Column 1
